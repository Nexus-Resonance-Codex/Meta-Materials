name: Compile LaTeX Papers

on:
  push:
    paths:
      - 'papers/**.tex'
      - '.github/workflows/latex_compile.yml'
  pull_request:
    paths:
      - 'papers/**.tex'
      - '.github/workflows/latex_compile.yml'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            papers/paper1_ttt7.tex
            papers/paper2_brr.tex
            papers/paper3_phi_infinity.tex
          compiler: latexmk
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-papers
          path: papers/*.pdf
