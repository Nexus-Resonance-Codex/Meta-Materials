[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-resonance-codex"
version = "1.0.0"
description = "Professional Meta-Materials Synthesis and Analysis Framework (NRC)"
authors = [
    {name = "James Paul Trageser", email = "NexusResonanceCodex@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "plotly>=5.14.0",
    "trimesh>=3.21.0",
    "streamlit>=1.22.0",
    "dash>=2.9.0",
    "pyvista>=0.39.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "black>=23.3.0",
    "ruff>=0.0.267",
    "flake8>=6.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E402", "E501"]
